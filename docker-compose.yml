services:
  backend:
    build:
      context: ./src/ParkingBackend
      dockerfile: Dockerfile
    container_name: parking_backend
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    restart: unless-stopped

  frontend:
    build:
      context: ./src/ParkingFrontend
      dockerfile: Dockerfile
    container_name: parking_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped